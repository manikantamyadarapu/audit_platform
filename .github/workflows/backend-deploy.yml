name: Backend & Python Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'python-service/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'python-service/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend — validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          CLEAN_DATABASE_URL=$(echo "${{ secrets.DATABASE_URL }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          CLEAN_DIRECT_URL=$(echo "${{ secrets.DIRECT_URL }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          DATABASE_URL="$CLEAN_DATABASE_URL" DIRECT_URL="$CLEAN_DIRECT_URL" npx prisma generate

      - name: Validate Prisma schema
        run: |
          CLEAN_DATABASE_URL=$(echo "${{ secrets.DATABASE_URL }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          CLEAN_DIRECT_URL=$(echo "${{ secrets.DIRECT_URL }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          DATABASE_URL="$CLEAN_DATABASE_URL" DIRECT_URL="$CLEAN_DIRECT_URL" npx prisma validate

  python-check:
    name: Python — smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine contract tests
        run: |
          pytest -q \
            tests/test_health.py \
            tests/test_financials_pivot.py \
            tests/test_financials_router_contracts.py \
            tests/test_section44ab.py

  deploy:
    name: Deploy to server
    needs: [backend-check, python-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: backend
        run: |
          CLEAN_DATABASE_URL=$(echo "${{ secrets.DATABASE_URL }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          CLEAN_DIRECT_URL=$(echo "${{ secrets.DIRECT_URL }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          DATABASE_URL="$CLEAN_DATABASE_URL" DIRECT_URL="$CLEAN_DIRECT_URL" npx prisma migrate deploy

      - name: Create SSH directory
        run: mkdir -p ~/.ssh

      - name: Write SSH Key
        run: |
          cat << 'EOF' > ~/.ssh/deploy_key
          ${{ secrets.DEPLOY_SSH_KEY }}
          EOF

      - name: Set SSH Key Permissions
        run: chmod 600 ~/.ssh/deploy_key

      - name: Configure known_hosts
        run: |
          if [ -z "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            echo "DEPLOY_KNOWN_HOSTS secret is required (pin host keys; do not disable StrictHostKeyChecking)"
            exit 1
          fi
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync backend
        run: |
          CLEAN_USER=$(echo "${{ secrets.DEPLOY_USER }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          CLEAN_HOST=$(echo "${{ secrets.DEPLOY_HOST }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          CLEAN_PATH=$(echo "${{ secrets.DEPLOY_BACKEND_PATH }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          rsync -avz --delete \
            --exclude node_modules \
            --exclude .env \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            backend/ \
            "${CLEAN_USER}@${CLEAN_HOST}:${CLEAN_PATH}/"

      - name: Rsync python-service
        run: |
          CLEAN_USER=$(echo "${{ secrets.DEPLOY_USER }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          CLEAN_HOST=$(echo "${{ secrets.DEPLOY_HOST }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          CLEAN_PATH=$(echo "${{ secrets.DEPLOY_PYTHON_PATH }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          rsync -avz --delete \
            --exclude .venv \
            --exclude __pycache__ \
            --exclude .pytest_cache \
            --exclude .env \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            python-service/ \
            "${CLEAN_USER}@${CLEAN_HOST}:${CLEAN_PATH}/"

      - name: Install & restart services on server
        run: |
          CLEAN_USER=$(echo "${{ secrets.DEPLOY_USER }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          CLEAN_HOST=$(echo "${{ secrets.DEPLOY_HOST }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          CLEAN_BACKEND_PATH=$(echo "${{ secrets.DEPLOY_BACKEND_PATH }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          CLEAN_PYTHON_PATH=$(echo "${{ secrets.DEPLOY_PYTHON_PATH }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts \
            "${CLEAN_USER}@${CLEAN_HOST}" \
            "set -euo pipefail && \
            cd '${CLEAN_BACKEND_PATH}' && \
            npm ci && \
            npx prisma generate && \
            (pm2 restart audit-backend --update-env || pm2 start src/server.js --name audit-backend) && \
            cd '${CLEAN_PYTHON_PATH}' && \
            (test -d .venv || python3 -m venv .venv) && \
            . .venv/bin/activate && \
            pip install -r requirements.txt && \
            (pm2 restart audit-python --update-env || pm2 start .venv/bin/uvicorn --name audit-python --cwd '${CLEAN_PYTHON_PATH}' -- app.main:app --host 127.0.0.1 --port 8000)"

      - name: Health check
        run: |
          CLEAN_USER=$(echo "${{ secrets.DEPLOY_USER }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          CLEAN_HOST=$(echo "${{ secrets.DEPLOY_HOST }}" | sed -e 's/^[[:space:]"'\''\r\n]*//' -e 's/[[:space:]"'\''\r\n]*$//')
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts \
            "${CLEAN_USER}@${CLEAN_HOST}" \
            "curl -fsS http://127.0.0.1:4002/api/health && curl -fsS http://127.0.0.1:8000/api/health"
